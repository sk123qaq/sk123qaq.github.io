<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书库 · 今天读哪一页</title>
<link rel="stylesheet" href="assets/style.css">
<style>
#dead-toast{position:fixed;left:50%;bottom:48px;transform:translate(-50%,12px);z-index:99;
  padding:10px 18px;border-radius:2px;background:#211e1a;color:#f3f0e7;font-size:13px;
  letter-spacing:.04em;opacity:0;transition:opacity .22s ease,transform .22s ease;pointer-events:none}
#dead-toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>
<body>
<div class="page">
  <header class="masthead">
    <div class="brand">
      <span class="seal" aria-hidden="true">书</span>
      <div>
        <h1>书库</h1>
        <p>私人藏书 · 本地实例</p>
      </div>
    </div>
    <div class="dateline">
      <div><b>2026.11.10</b><span class="sep">/</span>星期二</div>
      <div>5 本可读</div>
    </div>
  </header>

  <main class="main">
    <section aria-labelledby="toc-title">
      <div class="section-head">
        <span class="eyebrow" id="toc-title">目录</span>
        <span class="hint">按 1 – 3 直接进入</span>
      </div>
      <ol class="toc">
        <li>
          <a class="row" href="#" data-dead="「/go/search」" target="_blank" rel="noopener" data-key="1">
            <span class="num">壹</span>
            <span>
              <span class="title">找一段</span>
              <span class="desc">问一句，找到原文。答案后面带着出处。</span>
            </span>
            <span class="meta">原文与出处</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a class="row" href="#" data-dead="「/go/reading」" target="_blank" rel="noopener" data-key="2">
            <span class="num">贰</span>
            <span>
              <span class="title">翻开书</span>
              <span class="desc">速读、通读、细读、深研，今天读多深由你定。</span>
            </span>
            <span class="meta">5 本可读</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
        <li>
          <a class="row" href="#" data-dead="「/go/daily」" target="_blank" rel="noopener" data-key="3">
            <span class="num">叁</span>
            <span>
              <span class="title">往期日课</span>
              <span class="desc">每天一章，一段话。前面几期都在这里。</span>
            </span>
            <span class="meta">8 期</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </li>
      </ol>
    </section>

    <aside class="aside">
      <span class="aside-tab">今日夹页</span>
      <article class="slip"><div class="slip-head"><span>今日日课</span><span class="issue">静态样例</span></div><p class="kicker">当期原文有版权</p><h2>这一栏没有导出</h2><p class="excerpt">日课每天换一本、引当期原文；静态样例只导出公有领域的《阿Q正传》，这一栏留空。</p></article>
      <p class="aside-note">日课在本地实例里每天更新。</p>
    </aside>
  </main>

  <footer class="foot">
    <span class="keys">
      <span><kbd>1</kbd> 找一段</span><span><kbd>2</kbd> 翻开书</span><span><kbd>3</kbd> 往期日课</span>
    </span>
    <a class="admin" href="#" data-dead="「/go/ops」" target="_blank" rel="noopener">管理</a>
  </footer>
</div>



<script>
(function(){
  var box = document.createElement('div');
  box.id = 'dead-toast';
  document.body.appendChild(box);
  var timer = 0;
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('[data-dead]');
    if (!a) return;
    e.preventDefault();
    box.textContent = '静态样例 · ' + (a.getAttribute('data-dead') || '这一页') + '没有导出';
    box.classList.add('on');
    clearTimeout(timer);
    timer = setTimeout(function(){ box.classList.remove('on'); }, 2200);
  }, true);
})();
</script></body></html>
